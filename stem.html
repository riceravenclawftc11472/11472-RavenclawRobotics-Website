    <script>
      // 1. Check if the user turned off the trail on a previous page
      if (localStorage.getItem('cursorTrailDisabled') === 'true') {
        document.body.classList.add('no-trail');
      }
  
      // 2. Mouse movement event: Creates sparkles
      document.addEventListener('mousemove', (e) => {
        // STOP if the 'no-trail' toggle is active
        if (document.body.classList.contains('no-trail')) {
          return;
        }
  
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
  
        const size = Math.random() * 12 + 6;
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
  
        sparkle.style.left = e.pageX + 'px';
        sparkle.style.top = e.pageY + 'px';
  
        document.body.appendChild(sparkle);
  
        setTimeout(() => {
          sparkle.remove();
        }, 600);
      });
  
      // 3. Toggle Button: Switches trail state AND saves it to memory
      const toggleBtn = document.getElementById('toggle-cursor-btn');
  
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.body.classList.toggle('no-trail');
  
          // Check if no-trail is active and save 'true' or 'false' to localStorage
          const isDisabled = document.body.classList.contains('no-trail');
          localStorage.setItem('cursorTrailDisabled', isDisabled);
        });
      }
    </script>
