    <script>
      document.addEventListener('mousemove', function(e) {
        // Create a span element for each sparkle
        let sparkle = document.createElement('span');
        sparkle.classList.add('sparkle');
        
        // Set position to match the mouse cursor
        sparkle.style.left = e.pageX + 'px';
        sparkle.style.top = e.pageY + 'px';
        
        // Randomize size slightly for a realistic effect
        let size = Math.random() * 8 + 4; // Between 4px and 12px
        sparkle.style.width = size + 'px';
        sparkle.style.height = size + 'px';
      
        document.body.appendChild(sparkle);
      
        // Remove the sparkle after its animation completes (600ms)
        setTimeout(() => {
          sparkle.remove();
        }, 600);
      });
      </script>
